<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Project SHIZ - A.R.C.S.</title>

    <link rel="stylesheet" href="css/01-theme.css">
    <link rel="stylesheet" href="css/02-layout.css">
    <link rel="stylesheet" href="css/03-components.css">
    <link rel="stylesheet" href="css/04-animation.css">
    <link rel="stylesheet" href="css/05-state.css">

</head>

<body>

<div id="bootScreen" class="boot-screen">

    <div class="boot-frame">

        <div class="boot-title">
            PROJECT SHIZ
        </div>

        <div class="boot-divider"></div>

        <div class="boot-subtitle">
            A.R.C.S.
        </div>

        <div class="boot-system-name">
            Advanced Random<br>
            Control System
        </div>

        <div class="boot-divider"></div>

        <div class="boot-message">
            INITIALIZING...
        </div>

        <div class="boot-bar">
            <span></span>
        </div>

        <div class="boot-status">
            SYSTEM STARTUP SEQUENCE
        </div>

    </div>

</div>


<div class="hud"></div>


<header>

    <div class="logo">
        A.R.C.S.
    </div>

    <div class="operator-panel">

        <div class="operator-label">
            OPERATOR
        </div>

        <div id="operatorName" class="operator-name">
            忠犬しず
        </div>

    </div>

    <div class="status">

        <span class="online"></span>

        <span>ONLINE</span>

    </div>

</header>


<main>

    <section id="databasePanel">

        <h2>DATABASE</h2>

        <div class="counter single-counter">

            <div>
                Registered Entries
                <strong id="movieCount">0</strong>
            </div>

        </div>

        <div class="register">

            <input
                id="movieInput"
                type="text"
                placeholder="Entry Name">

            <button id="addMovie">
                ADD
            </button>

        </div>

        <div id="movieCards"></div>

        <div class="panel-actions database-actions">

            <button id="clearAllButton">
                CLEAR ALL
            </button>

        </div>

    </section>


    <section id="corePanel">

        <div id="ring">

            <div class="ring2"></div>
            <div class="ring3"></div>

        </div>

        <div id="systemMessage">
            <span>A.R.C.S.</span>
            <span>SYSTEM READY</span>
        </div>

        <div id="resultPanel" class="result-panel">

            <div class="result-label">
                TARGET LOCK
            </div>

            <div id="resultTitle" class="result-title">
                ---
            </div>

            <div class="result-meta">

                <div>
                    <span>DATABASE ID</span>
                    <strong id="resultId">----</strong>
                </div>

                <div>
                    <span>AI CONFIDENCE</span>
                    <strong id="resultConfidence">--.--%</strong>
                </div>

                <div>
                    <span>STATUS</span>
                    <strong id="resultStatus">LOCKED</strong>
                </div>

            </div>

        </div>

        <div class="control-row">

            <button id="startButton">
                START
            </button>

            <button id="resetButton">
                RESET
            </button>

        </div>

    </section>


    <section id="systemPanel">

        <h2>SYSTEM</h2>

        <div id="terminal"></div>

        <div class="panel-actions system-actions">

            <button id="clearLogButton">
                CLEAR LOG
            </button>

        </div>

    </section>

</main>


<footer>
    PROJECT SHIZ | Powered by A.R.C.S.
</footer>


<script src="js/main.js"></script>

</body>

</html>
